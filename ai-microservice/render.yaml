services:
  - type: web
    name: kardex-ia-microservice
    env: docker
    dockerfilePath: ./ai-microservice/Dockerfile
    dockerContext: ./ai-microservice
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: OCR_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: "*"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: gemini-2.0-flash
